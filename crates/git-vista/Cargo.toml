[package]
name = "git-vista"
description = "git-vista Leptos frontend — renders the vertical git graph in the browser (built to wasm by Trunk)."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Single binary, built by Trunk for the wasm32 target.
[[bin]]
name = "git-vista-ui"
path = "src/main.rs"

[dependencies]
# Shared data models (compiles for wasm too — pure logic, no UI deps).
git-vista-core = { workspace = true }
# The conflict view model (M10.07, #462; ADR 0105) — four-pane inspection, the
# resolution surface, and the marker-file block editor's composing core. These
# were files in `features/conflicts/` until gv-tui needed the same model; the
# module there now re-exports this crate so no call site here changed.
git-vista-conflicts = { workspace = true }
# The versioned HTTP transport contract (M1.02): protocol version + negotiation,
# the API error envelope, and the shared request/response DTOs. Pure/wasm-safe.
git-vista-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The frontend is only ever built for wasm32 (by Trunk). Keeping the UI deps
# here means a host-target `cargo build --workspace` compiles a tiny native stub
# instead of pulling Leptos/wasm-bindgen for a target they can't run on.
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
# The JS `Date`, used to format commit timestamps in the viewer's local timezone.
js-sys = "0.3"
# #216/#218: `select` + `oneshot`, to bound a fetch that would otherwise hang
# forever on a dead SSH-forwarded socket. Already in the lock transitively.
futures = { version = "0.3", default-features = false, features = ["std"] }
# Event types used by the pan/zoom handlers. Leptos pulls web-sys in already;
# we list the exact features we call so the build doesn't rely on its defaults.
web-sys = { version = "0.3", features = [
    # Activity/Undo step 2: get_element_by_id, so "Show diff" can scroll the
    # detail panel's Changes section into view once it renders.
    "Document",
    "DomRect",
    "Element",
    # M1.11 (#64): the operation progress stream. `EventSource` cannot set request
    # headers, which is why ADR 0020 gave that one route a query-string protocol
    # negotiation path instead.
    "EventSource",
    "MessageEvent",
    "Event",
    "EventTarget",
    # M1.02 "Update Required" screen: window.location().reload() when the client's
    # protocol is incompatible with the server's.
    "Location",
    # M1.04 session bootstrap: window.history().replace_state_with_url(…) to strip
    # the one-time `#s=<token>` from the URL the moment it's exchanged.
    "History",
    # M2.22a (#241): navigator.onLine, seeding the connectivity guard.
    "Navigator",
    # Phase 13: keyboard shortcuts (Esc / +/-/0 / r) via a window keydown listener.
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
    # M1.13 (#65 keyboard-access gap): roving tabindex over the commit rows.
    # `FocusEvent` — a Tab lands on the tabbable `.node-hit` circle.
    # `SvgElement` — `.focus()`/`.blur()` (the HTMLOrSVGElement mixin) on the
    # commit-dot hit circles, which are SVG, not HTML, elements.
    "FocusEvent",
    "SvgElement",
    # Issue #18: `window()` plus the native prompt()/alert() dialogs used to ask
    # for a branch name and report a failure.
    "Window",
    # Icon system: the Nerd-Font-vs-plain-text preference persists in
    # localStorage so it survives reloads.
    "Storage",
    # Context-menu placement: iOS Safari's *visual* viewport (inner_height
    # over-reports while the URL bar is expanded), so the menu is clamped
    # against what's actually visible.
    "VisualViewport",
    # #591: `window.matchMedia("(prefers-reduced-motion: reduce)")`, so the
    # preview animation can degrade to its resting frame instead of playing
    # for a user who asked the platform for less motion.
    "MediaQueryList",
] }
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }

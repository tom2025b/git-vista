# git-vista-mcp — the MCP stdio bridge (M2.23a, #245).
#
# Deliberately tiny dependency surface: the MCP framing is hand-rolled
# newline-delimited JSON-RPC 2.0 (see main.rs for why), and the HTTP client is
# a minimal hand-rolled HTTP/1.1-over-TcpStream implementation (see http.rs) —
# the server is loopback-only on one fixed port, both endpoints this crate
# calls return small Content-Length JSON bodies, and pulling reqwest/hyper as
# a *client* would add a dependency tree the reviewed-dependency discipline
# (docs/NATIVE_DEPENDENCIES.md) would then have to carry forever.
#
# This crate links git-vista-protocol (the shared wire contract — headers,
# DTOs) and git-vista-core (the *pure*, wasm-safe domain-model crate the
# generic HistoryFrame/HistoryPage envelopes are instantiated over — GitRef,
# GraphRow, Edge, FrameStub, CommitDetail, CommitDiff, ActivityEvent) — but
# deliberately, structurally NOT git-vista-server: the token-path resolution
# is a small mirrored function (#245's scope), and #246's dependency-graph
# test (tests/no_write_dependency.rs) proves this crate's whole transitive
# dependency graph never reaches git-vista-server, so no write handler is
# ever reachable code, not merely unrouted.
[package]
name = "git-vista-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
git-vista-core = { workspace = true }
git-vista-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# #450's `lesson.rs` tests: a real repository built by real `git`, so
# `get_lesson`'s fidelity is proven against genuine on-disk state and not
# just against hand-typed JSON. Dev-only, both directions — `git-vista-fixtures`
# itself never depends on `git-vista-server` (see its own Cargo.toml), so this
# does not touch `tests/no_write_dependency.rs`'s guarantee, which walks the
# whole resolved graph, dev-dependencies included.
git-vista-fixtures = { workspace = true }

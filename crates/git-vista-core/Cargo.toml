[package]
name = "git-vista-core"
description = "Pure logic for git-vista: git parsing, graph layout, and data models. No UI dependencies."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Pure logic only — no platform/UI deps — so this crate compiles for wasm and
# is shared by the browser frontend. Git reading (gix) lives in `git-vista-git`.
[dependencies]
serde = { workspace = true }
# Opaque repository/worktree identity. Name-based (`v5`) only — deterministic and
# randomness-free, so this crate stays pure and wasm-compatible. See `identity`.
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

<!-- Home-screen / install icon. Source of truth for the PNGs beside it
     (icon-180/192/512.png), which are rendered from this file — see the
     "Regenerating" note at the bottom.

     This is deliberately NOT the same artwork as the inline favicon data URI in
     index.html, even though it draws the same little branch graph:

       * full-bleed square background, no `rx` rounding. iOS/iPadOS applies its
         own squircle mask to a home-screen icon, so a pre-rounded source gets
         masked twice and shows dark slivers in the corners. The favicon keeps
         its rx=7 because nothing masks a browser-tab icon.
       * the glyph is scaled to 0.85 and re-centred, so the artwork sits inside
         the squircle's safe area instead of running to the edges.
       * fully opaque. `apple-touch-icon` has no transparency support worth
         relying on; a transparent PNG composites against black on some iOS
         surfaces and looks broken. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#0d1117"/>
  <!-- glyph bbox is x 8.8..25.2 (centre 17), y 3.3..28.7 (centre 16); this
       transform centres that box on (16,16) and scales it to 85%. -->
  <g transform="translate(16,16) scale(0.85) translate(-17,-16)">
    <path d="M12 6 V26" stroke="#2f81f7" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 16 C12 11, 21 13, 22 9" stroke="#3fb950" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="12" cy="6.5" r="3.2" fill="#2f81f7"/>
    <circle cx="12" cy="16" r="3.2" fill="#2f81f7"/>
    <circle cx="12" cy="25.5" r="3.2" fill="#2f81f7"/>
    <circle cx="22" cy="8.5" r="3.2" fill="#3fb950"/>
  </g>
</svg>
<!-- Regenerating (no SVG rasteriser is installed on this box; headless Chromium
     is the render path that actually exists here):

       cd crates/git-vista/assets
       printf '<body style="margin:0"><img src="icon.svg" width="512" height="512">' > /tmp/i.html
       chromium --headless --disable-gpu --hide-scrollbars \
                --force-device-scale-factor=1 --window-size=512,512 \
                --screenshot=/tmp/icon-512.png /tmp/i.html
       # then downscale 512 -> 192 and 180 with PIL/LANCZOS so all three sizes
       # are guaranteed to be the same artwork.
-->

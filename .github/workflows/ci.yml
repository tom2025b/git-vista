# Continuous Integration for git-vista.
#
# Workspace layout this pipeline cares about:
#   - git-vista-core     pure logic crate (model + layout); has tests
#   - git-vista-git      native git reader via gix; has tests (uses the git binary)
#   - git-vista-protocol the versioned wire contract: version negotiation plus
#                        golden-fixture DTO-shape guards (#67 M1.14); has tests
#   - git-vista-server   native axum backend: serves the SPA + /api/commits
#   - git-vista          Leptos frontend, built to WASM by Trunk (crates/git-vista)
#
# Seven jobs run in parallel, each mapped to a concrete check:
#   1. lint      format + strict native/WASM Clippy + shell syntax
#   2. core      test + check the pure-logic, git-reading, protocol, server, and
#                UI crates, plus (#67 M1.14) the runner's git version against
#                the documented floor in docs/SUPPORTED_VERSIONS.md
#   3. contract  the M1.06 write contract (#146): planner pipeline, argv
#                boundary, staleness gates — plus, since #67 M1.14, the route-
#                authorization gate (route_authz): every route main.rs
#                registers must carry an explicit auth classification. Its own
#                named check on every PR.
#   4. frontend  build the real WASM bundle with Trunk
#   5. audit     cargo-audit over the dependency tree (#67 M1.14): fails on any
#                advisory, including "unmaintained" warnings, except IDs listed
#                in .cargo/audit.toml with a matching, unexpired row in
#                docs/DEPENDENCY_EXCEPTIONS.md — that cross-check is its own
#                step so a stale or undocumented exception is a red build, not
#                a silent pass
#   6. secrets   gitleaks over the full repo history (#67 M1.14): committed
#                credentials are a distinct named check, pinned to a commit SHA
#   7. sandbox   #66 (M1.13b): the escape-battery gate, built from the
#                anti-vacuity contract's step 1 (see
#                docs/sandbox/escape-battery-anti-vacuity-contract.md)
#                — a preflight naming any missing host capability, then the
#                battery itself, then three shell-level assertions over the
#                report file it writes, none of which the tests decide for
#                themselves
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"

# A newer push to the same ref cancels an in-flight run, so PRs don't queue up
# stale builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"   # CI builds are one-shot; incremental only adds overhead.
  RUST_BACKTRACE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Lint: formatting + strict Clippy, the exact commands contributors run
  #    locally (see README "Tests"). Split from the build/test jobs so a
  #    formatting or lint regression is reported as its own red check.
  #
  # Clippy runs twice: once for the native host (the whole workspace) and once
  # for the configured wasm32 target, scoped to the frontend crate. The wasm
  # pass is frontend-only because git-vista-git (gix) and git-vista-server
  # (axum/tokio) are native-only and don't compile for wasm32.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Formatting is clean
        run: cargo fmt --all -- --check

      - name: Clippy (native, strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (wasm32 frontend, strict)
        run: cargo clippy -p git-vista --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Shell launchers parse
        run: |
          bash -n gv dev
          ./gv help >/dev/null

  # ---------------------------------------------------------------------------
  # 1. Core + git + protocol + server + frontend crates: build check + tests,
  #    plus the runner's own git version against the documented floor.
  #
  # git-vista-core is pure logic; git-vista-git reads real repos via gix (its
  # tests shell out to the `git` binary, preinstalled on the runner) — hence
  # the version-floor check below runs first, in the job whose tests actually
  # depend on it; git-vista-protocol is the wire contract (version negotiation
  # plus the golden-fixture DTO-shape guards, #67 M1.14 — previously missing
  # from every CI job's test invocation entirely, so a wire-format regression
  # could pass every check green); git-vista-server is the axum backend;
  # git-vista is the Leptos frontend, whose host-side unit tests (colour/
  # geometry/text/…) run natively because its wasm-only view module is
  # `#[cfg]`-gated out. None need GTK/WebKit, so this job needs nothing beyond
  # stable Rust. Together they carry the project's test suite.
  # ---------------------------------------------------------------------------
  core:
    name: Core (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # #67 M1.14: the floor lives in exactly one place — the "## Git: X.Y or
      # later" heading in docs/SUPPORTED_VERSIONS.md — and this step parses it
      # out rather than duplicating the number, the same anti-drift pattern
      # the dependency-exceptions step uses against .cargo/audit.toml. A
      # runner below the floor fails loudly here, before any test that
      # depends on git behaviour this old a binary might not have.
      - name: Git version meets the documented floor
        run: |
          floor=$(grep -oP '^## Git: \K[0-9]+\.[0-9]+' docs/SUPPORTED_VERSIONS.md)
          if [ -z "$floor" ]; then
            echo "::error::couldn't parse the git version floor out of docs/SUPPORTED_VERSIONS.md (expected a '## Git: X.Y or later' heading) — the doc and this check may have drifted apart"
            exit 1
          fi
          actual=$(git --version | grep -oP '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "documented floor: $floor — runner git: $actual"
          lowest=$(printf '%s\n%s\n' "$floor" "$actual" | sort -V | head -1)
          if [ "$lowest" != "$floor" ]; then
            echo "::error::runner git ($actual) is older than the documented floor ($floor, docs/SUPPORTED_VERSIONS.md)"
            exit 1
          fi

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check core + git + protocol + server crates build
        run: cargo check -p git-vista-core -p git-vista-git -p git-vista-protocol -p git-vista-server

      # #67 M1.14 closure audit: this used to name each crate explicitly,
      # which is exactly how git-vista-protocol went missing from CI test
      # runs for as long as it did (task 6) — a sixth workspace member added
      # later could repeat that silently. `--workspace` is behaviourally
      # identical today (these five `-p` names are the whole workspace,
      # confirmed against Cargo.toml's `members`) and closes that class of
      # gap going forward without needing anyone to remember to update this
      # line. The `check` step above intentionally omits `git-vista` (its
      # native check here is redundant with the `lint` job's
      # `--workspace --all-targets` clippy pass and the `frontend` job's
      # real Trunk build) — left as-is, that asymmetry predates this audit
      # and isn't the gap being closed here.
      - name: Test core + git + protocol + server + frontend crates
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # 3. The M1.06 write contract (#146, parent #59) plus the #67 M1.14 route-
  #    authorization gate, as one job so it is a distinct named check on every
  #    PR: the end-to-end pipeline suite (build → validate → execute for every
  #    GitOperation kind + the single-funnel proof), the #144 argv boundary
  #    (tripwire + adversarial wire fixtures), the #145 staleness gates, and
  #    (route_authz) the structural proof that every route main.rs registers
  #    carries an explicit authorization classification — see
  #    crates/git-vista-server/src/route_authz.rs for why that gate exists.
  #
  #    The same tests also run inside the `core` job's full sweep — running on
  #    every PR is a superset of "PRs touching the planner, a write handler, or
  #    the route table", chosen over path filters so the check can never be
  #    skipped by a filter gap (and a path-filtered required check would hang
  #    pending on non-matching PRs). This job exists so a contract or route-
  #    authorization regression is readable at a glance in the checks list, and
  #    stays enforced even if the core job's test invocation is ever narrowed.
  # ---------------------------------------------------------------------------
  contract:
    name: M1.06 write contract + #67 route authorization (planner + argv boundary + staleness + route authz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # libtest exits 0 on "0 passed" — a renamed module would turn the filter
      # into a green no-op. The count floor makes silent de-selection loud.
      - name: Contract + route-authz suites (with a not-silently-empty floor)
        run: |
          set -o pipefail
          cargo test -p git-vista-server -- contract_suite argv_boundary planner::tests route_authz \
            | tee contract-tests.log
          passed=$(grep -oE '[0-9]+ passed' contract-tests.log | awk '{s+=$1} END {print s}')
          echo "contract + route-authz tests passed: ${passed:-0}"
          if [ "${passed:-0}" -lt 35 ]; then
            echo "::error::Contract/route-authz filter matched too few tests (${passed:-0} < 35) — did a suite module get renamed?"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 7. Sandbox: the #66 (M1.13b) escape-battery gate.
  #
  # Built from the anti-vacuity contract's step 1, not from any earlier plan
  # draft (see docs/sandbox/escape-battery-anti-vacuity-contract.md,
  # "Skip policy" and "Ordered work" §1). Three verified false-green channels
  # rule out the obvious shortcuts: libtest swallows stdout+stderr of PASSING
  # tests, so a `grep SKIPPED` gate cannot distinguish "no skip happened" from
  # "a skip happened and nothing prints it"; `cargo test <filter>` exits 0 on
  # "0 passed; 0 filtered out", so a renamed module empties a filter-based gate
  # silently; and neither failure mode is survivable from *inside* the tests,
  # because the tests never decide severity — the job does, over an artifact
  # (the report file) both a real run and a mis-provisioned runner produce
  # identically.
  #
  # Two independently-named red checks, on purpose: a preflight step that
  # fails with `::error::` naming exactly which host capability is missing
  # (so "this runner cannot provide the sandbox" is never mistaken for "the
  # sandbox failed to contain something"), then the battery itself, then three
  # shell-level assertions over `$GV_ESCAPE_REPORT`. A false green would need
  # two independent mistakes, not one.
  #
  # The R9 mutation matrix runs in this same named gate only on pull requests
  # that touch sandbox production paths, plus the nightly schedule. It is not
  # paid on pushes or unrelated pull requests. Each mutant is applied to an
  # isolated copy; a non-applying patch is a hard failure, never a skip.
  # ---------------------------------------------------------------------------
  sandbox:
    name: Sandbox (#66 escape-battery gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this run requires the mutation matrix
        id: mutation_scope
        run: |
          run=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            run=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            if git diff --name-only "$base" "$head" -- \
              crates/git-vista-server/src/sandbox \
              crates/git-vista-server/src/bin/gv-sandbox \
              | grep -q .; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "mutation matrix required: $run"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Best-effort: gives the strict tier its two host dependencies before
      # the preflight measures what is actually available.
      - name: Best-effort host setup (bwrap, a C compiler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap build-essential patch rsync

      # D6 Option A — decided by Tom 2026-07-29, re-confirmed 2026-07-30.
      # Rationale in design-docs/2026-07-29-d6-sandbox-ci-preflight-decision.md
      # and plan Global Constraint 11.
      #
      # GitHub's ubuntu-latest ships kernel.apparmor_restrict_unprivileged_userns=1.
      # Under that clamp `bwrap` cannot create its namespaces, so the Strict tier
      # cannot be constructed at all — and because a case that cannot demonstrate
      # its own premise is now a HARD FAILURE rather than a skip, the escape
      # battery would go red without ever testing a single invariant. Either way
      # the 17 invariants this milestone exists to prove would never gate a merge.
      #
      # So the clamp is lifted here, deliberately and visibly, and the step FAILS
      # LOUDLY if the write does not take — it never falls through to a degraded
      # run. That distinction is the whole point: a silent workaround would be
      # indistinguishable from a sandbox that works.
      #
      # Safe here specifically because GitHub-hosted runners are single-job,
      # ephemeral VMs, destroyed after the run and never reused — there is no
      # "left the box weaker" concern that would apply on a persistent host. Do
      # NOT copy this step to a self-hosted or reused runner without revisiting
      # that reasoning.
      - name: Preflight — unclamp unprivileged user namespaces (D6 Option A)
        run: |
          set -euo pipefail
          before="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 'absent')"
          echo "apparmor_restrict_unprivileged_userns before: $before"
          if [ "$before" = "absent" ]; then
            echo "sysctl not present on this kernel — nothing to unclamp; the capability preflight below is the real check."
            exit 0
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          after="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          echo "apparmor_restrict_unprivileged_userns after: $after"
          if [ "$after" != "0" ]; then
            echo "::error::Failed to unclamp unprivileged user namespaces (still '$after'). Refusing to continue: without this the Strict tier cannot be built, so the escape battery would report capability-absent and prove nothing. Failing loudly is the decided posture (D6 Option A) — do not add a fallback that lets the job pass having tested nothing."
            exit 1
          fi

      - name: Sandbox preflight (host capability check)
        run: cargo test -p git-vista-server ci_preflight_host_meets_the_declared_minimum

      - name: Escape battery + anti-vacuity tripwires
        run: |
          set -o pipefail
          export GV_ESCAPE_REPORT="${GITHUB_WORKSPACE}/gv-escape-report.txt"
          cargo test -p git-vista-server -- escape_suite hook_mode_suite escape_contract

      - name: Report assertions (exists / census diff both ways / zero capability-absent)
        run: |
          set -o pipefail
          report="${GITHUB_WORKSPACE}/gv-escape-report.txt"
          census="docs/sandbox/escape-census.txt"

          if [ ! -f "$report" ]; then
            echo "::error::GV_ESCAPE_REPORT ($report) was not written — either no case ran, or the env var did not reach the test process. An unset variable must fail closed, per the contract (R5)."
            exit 1
          fi

          grep -oE 'case=[^ ]+' "$report" | sed 's/^case=//' | sort -u > /tmp/got-ids.txt
          sort -u "$census" > /tmp/want-ids.txt
          if ! diff -q /tmp/got-ids.txt /tmp/want-ids.txt > /dev/null; then
            echo "::error::$census and the report's case-id set differ (equality both directions, not a floor — a rename must break this build, not silently empty the gate):"
            diff /tmp/got-ids.txt /tmp/want-ids.txt || true
            exit 1
          fi

          # Set equality above is necessary but not sufficient: `sort -u` collapses
          # duplicates, so a case that recorded twice — or a harness that replayed one
          # — matches the census perfectly. R5's prose says the report's case-id
          # MULTISET equals the census, and `run_case` writes exactly one record per
          # case, so the counts must match exactly too. Found by audit: this half of
          # R5 was specified and never built, the same shape as the census-drift miss.
          got_records=$(grep -cE 'case=[^ ]+' "$report" || true)
          want_records=$(grep -cE '^[^[:space:]]' "$census" || true)
          if [ "${got_records:-0}" -ne "${want_records:-0}" ]; then
            echo "::error::report has ${got_records} case record(s) but $census declares ${want_records}. The id SETS matched, so this is a duplicate or replayed record, not a rename — one case recorded more than once means the report is not a faithful log of what ran (R5: multiset equality, one record per case)."
            grep -oE 'case=[^ ]+' "$report" | sed 's/^case=//' | sort | uniq -d | sed 's/^/  duplicated: /'
            exit 1
          fi

          absent=$(grep -c 'result=capability-absent' "$report" || true)
          if [ "${absent:-0}" -ne 0 ]; then
            echo "::error::${absent} case(s) recorded capability-absent on the gating runner — see the report:"
            grep 'result=capability-absent' "$report"
            exit 1
          fi

          echo "sandbox gate OK: $(wc -l < "$report") case record(s), census matched, zero capability-absent."

      - name: Mutation matrix (R9)
        if: steps.mutation_scope.outputs.run == 'true'
        run: ./ci/mutation-matrix.sh

  # ---------------------------------------------------------------------------
  # 2. Frontend: build the WASM bundle with Trunk.
  #
  # This is the closest CI gets to "the real app builds" — Trunk compiles the
  # Leptos frontend to wasm32 and emits the dist/ bundle the shell loads.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Trunk / WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Install a pinned Trunk release from its prebuilt binary — faster and more
      # reproducible than `cargo install trunk` from source.
      - name: Install Trunk
        env:
          TRUNK_VERSION: v0.21.7
        run: |
          wget -qO- \
            "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf- -C /usr/local/bin trunk
          trunk --version

      # Trunk reads Trunk.toml / index.html from the frontend crate dir and
      # fetches the matching wasm-bindgen automatically.
      - name: Build frontend
        run: cd crates/git-vista && trunk build

  # ---------------------------------------------------------------------------
  # 5. Security advisory scan (#67 M1.14): cargo-audit over Cargo.lock.
  #
  # Deliberate choice, written down per the task: an advisory FAILS the build
  # (`--deny warnings`, which denies both CVSS-scored vulnerabilities — always
  # denied by cargo-audit regardless of this flag — and informational
  # "unmaintained"/"unsound"/"yanked" warnings, which are not denied by
  # default). Failing is survivable only because of the exceptions register:
  # .cargo/audit.toml's `ignore` list is what cargo-audit itself reads: an
  # advisory ID on that list is skipped. docs/DEPENDENCY_EXCEPTIONS.md is the
  # human-readable record of *why* each ID is there, who owns it, and when it
  # expires — cargo-audit's own config has no expiry concept, so the "register
  # is honest" step below enforces it: every ignored ID must have a matching,
  # unexpired row in the Markdown table, or the build fails even though
  # cargo-audit itself would have passed.
  # ---------------------------------------------------------------------------
  audit:
    name: Security audit (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-audit-0.22.2

      # Pinned exact version — a floating `cargo install cargo-audit` would
      # let the tool's own version drift unreviewed in a job whose entire
      # purpose is supply-chain scrutiny.
      - name: Install cargo-audit (pinned)
        run: cargo install cargo-audit --version 0.22.2 --locked

      # Cross-checks .cargo/audit.toml's ignore list against
      # docs/DEPENDENCY_EXCEPTIONS.md: every ignored advisory ID must have a
      # matching table row, every table row must still be in the ignore list,
      # and no row's expiry date may have passed. This is what makes an
      # exception mean "ignore until this date," not "ignore forever" — a
      # bare .cargo/audit.toml ignore entry has no expiry of its own.
      - name: Dependency exceptions register is honest
        run: |
          python3 - <<'PYEOF'
          import re, sys, datetime

          audit_toml = open(".cargo/audit.toml").read()
          exceptions_md = open("docs/DEPENDENCY_EXCEPTIONS.md").read()

          toml_ids = set(re.findall(r'"(RUSTSEC-\d{4}-\d+)"', audit_toml))

          row_re = re.compile(
              r'\|\s*\[(RUSTSEC-\d{4}-\d+)\]\([^)]+\)\s*\|[^|]*\|[^|]*\|[^|]*\|\s*(\d{4}-\d{2}-\d{2})\s*\|'
          )
          md_rows = row_re.findall(exceptions_md)
          md_ids = {rid for rid, _ in md_rows}

          errors = []
          only_in_toml = toml_ids - md_ids
          only_in_md = md_ids - toml_ids
          if only_in_toml:
              errors.append(
                  f"IDs in .cargo/audit.toml but missing a row in docs/DEPENDENCY_EXCEPTIONS.md: {sorted(only_in_toml)}"
              )
          if only_in_md:
              errors.append(
                  f"IDs documented in docs/DEPENDENCY_EXCEPTIONS.md but not ignored in .cargo/audit.toml: {sorted(only_in_md)}"
              )

          today = datetime.date.today()
          for rid, expiry_str in md_rows:
              expiry = datetime.date.fromisoformat(expiry_str)
              if expiry < today:
                  errors.append(
                      f"{rid}: exception expired on {expiry_str} (today is {today.isoformat()}) — renew or remove it from both files"
                  )

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)

          print(f"Dependency exceptions register OK: {len(md_ids)} exception(s), all in sync, none expired.")
          PYEOF

      # F10: the advisory register above gates *suppressions*, not *additions*.
      # Kernel-ABI crates get an explicit row with an owner and a rejected
      # alternative — see docs/NATIVE_DEPENDENCIES.md.
      - name: Native dependency register is honest
        run: |
          set -o pipefail
          missing=0
          for krate in libc seccompiler nix rustix landlock libseccomp; do
            if grep -qE "^\s*${krate}\s*=" crates/git-vista-server/Cargo.toml; then
              if ! grep -qF "| \`${krate}\` |" docs/NATIVE_DEPENDENCIES.md; then
                echo "::error::${krate} is a direct dependency of git-vista-server with no row in docs/NATIVE_DEPENDENCIES.md"
                missing=1
              fi
            fi
          done
          exit "$missing"

      # `--deny warnings` is the deliberate-failure choice explained above.
      # `.cargo/audit.toml`'s ignore list (verified honest by the step above)
      # is what makes today's three unmaintained-crate warnings survivable.
      - name: cargo audit
        run: cargo audit --deny warnings

  # ---------------------------------------------------------------------------
  # 6. Secret scanning (#67 M1.14): gitleaks over the full commit history.
  #
  # Runs the gitleaks binary directly rather than gitleaks/gitleaks-action:
  # the action scopes each run to the triggering event's own commits (one
  # commit on a one-commit PR), which is silently NOT a full-history scan
  # despite `fetch-depth: 0` — confirmed by running both side by side before
  # picking this approach. `gitleaks detect` with no `--log-opts` scans the
  # whole repo history by default, which is what "full history, since it's
  # cheap" actually requires. The binary is downloaded from a specific
  # release tag and its SHA-256 verified before use, rather than trusting a
  # floating action tag — a supply-chain hole in the one job whose purpose is
  # catching exactly that class of problem would defeat the point.
  #
  # `fetch-depth: 0` so the full history actually exists to scan; this repo
  # is small (a few thousand objects, low single-digit MB), so a full scan
  # costs single-digit seconds.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # No --log-opts: this is a genuine full-history scan, not an event
      # diff. --exit-code 1 (gitleaks' default) fails the job on any finding.
      - name: gitleaks (full history)
        run: ./gitleaks detect --source . --verbose --exit-code 1

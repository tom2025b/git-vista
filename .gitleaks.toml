# gitleaks configuration for Git-Vista.
#
# The CI job (`Secret scanning (gitleaks)`, .github/workflows/ci.yml) runs a
# genuine FULL-HISTORY scan. That is deliberate: a credential committed once and
# removed in the next commit is still a leaked credential, so scanning only the
# tip would defeat the check's purpose.
#
# The consequence is that history is immutable input. A false positive that was
# ever committed cannot be fixed by editing the working tree — the offending
# blob still exists in the commit that introduced it. Rewriting published
# history to erase it is not an option (a standing repo rule keeps history
# walkable, and force-pushing a shared branch to silence a scanner is a cure
# worse than the disease). So a false positive that reached history gets a
# FINGERPRINT allowlist entry: the narrowest exception the tool offers.
#
# RULES FOR ADDING AN ENTRY HERE — read before you add one:
#
#   * Allowlist by FINGERPRINT. Not by path, not by rule, not by regex. A
#     fingerprint is `commit:path:rule:line`, so it pins the exception to one
#     finding in one commit; the same path is still scanned normally in every
#     other commit.
#
#   * Do NOT use a `paths` allowlist, and do not "narrow" one by pairing it with
#     `commits` and `matchCondition = "AND"`. Both were tried here and MEASURED
#     on 2026-07-31 against gitleaks 8.30.1, and both failed open: a freshly
#     planted PEM private key in the allowlisted path, at a brand-new commit
#     unrelated to the allowlisted one, was NOT detected in either arrangement.
#     A `paths` entry blinds this repo to real key material in that file
#     permanently, which is precisely the outcome this check exists to prevent.
#
#   * A fingerprint entry is only ever correct for a PROVEN false positive. If
#     the value was a real credential, the fix is to rotate it, not to allowlist
#     it. Allowlisting a live secret converts a loud failure into silent
#     exposure.
#
#   * Re-verify after any edit, with BOTH legs — a suppression that also
#     suppresses real findings is worse than no suppression, and only the paired
#     test can tell the two apart:
#       1. `gitleaks detect --source . --exit-code 1` on this repo => no leaks.
#       2. In a throwaway git repo, commit a real-shaped PEM block at the SAME
#          path as an allowlisted finding but a DIFFERENT commit, scan it with
#          this config => it MUST still be reported. If it is not, the entry is
#          too wide; fix it before pushing.

[extend]
useDefault = true

[[allowlists]]
targetRules = ["private-key"]
description = """
False positive, commit 8e2cec7 only.

The CI host-provisioning action (.github/actions/host-sandbox-setup) writes a
placeholder file at $HOME/.ssh/id_ed25519 so that the escape battery's denial
legs have a path which EXISTS outside the sandbox. Without it,
`secret_read_denied` and `ssh_known_hosts_carveout` (#188) get ENOENT on their
baseline leg and hard-fail having proved nothing about containment — the
battery's anti-vacuity design treats "could not establish the premise" as a
hard failure rather than a skip.

That placeholder's first line was originally written to look like a real OpenSSH
key header, which is what this rule matched. It is not key material: nothing
parses it as a key, the probes only open the path and read one byte, and the
file is generated fresh on an ephemeral GitHub-hosted runner rather than being
committed to the repo. Nothing needs rotating.

The working tree no longer contains the PEM-shaped text — the placeholder was
reworded in 45de344 so that new commits do not re-trip the rule. This entry
exists solely because the full-history scan still reaches commit 8e2cec7, which
cannot be edited.
"""
# `commits` (not `paths`) is the narrowing dimension, and it is the only one
# gitleaks 8.30.1 will accept here: a top-level [[allowlists]] block must carry
# at least one of commits/paths/regexes/stopwords, so `fingerprints` alone will
# not load. Scoping by commit is the safe choice of the four — commit 8e2cec7 is
# a single immutable point in history, so this exception cannot grow, and the
# action.yml path continues to be scanned normally in every other commit
# including every future one. Scoping by path instead would have blinded that
# file permanently (measured — see the header).
#
# 2026-08-04: the SECOND commit below is the SAME placeholder at a new SHA, not
# a new finding. `main` was rewritten to strip 91 commits carrying a personal
# gmail address, which rewrote every commit id in the repository — so the
# immutable point this allowlist pinned (8e2cec7) no longer exists in the
# rewritten history, and the identical placeholder resurfaced as 056bd42.
# Verified by reading the blob: it is the same reworded PEM-shaped placeholder,
# whose own body states it is not key material and is never parsed as such.
#
# Note the maintenance cost this implies: any future history rewrite will
# invalidate these pins again and the finding will return under yet another id.
# That is the price of commit-scoping, and it is still the right trade — a
# `paths` entry would blind this file to real key material permanently, which
# was measured and rejected in the header above.
commits = [
  "8e2cec76183ced717792ee84ca324fee519c88c1",
  "056bd4282542e0eddd1dd1d4d2d32fffe7267df9",
]
fingerprints = [
  "8e2cec76183ced717792ee84ca324fee519c88c1:.github/actions/host-sandbox-setup/action.yml:private-key:179",
  "056bd4282542e0eddd1dd1d4d2d32fffe7267df9:.github/actions/host-sandbox-setup/action.yml:private-key:179",
]

[[allowlists]]
targetRules = ["generic-api-key"]
description = """
False positive, commit 6f9ef5da only. #586 (M13.05), ADR 0123.

ADR 0123's mutation-proof section records the failure-atlas run key its two
mutation arms were filed under. That commit wrote it as an inline
`<the underscore spelling of "run key">:`-then-value pair, and the
`generic-api-key` rule scores that adjacency as a secret because the value
carries enough entropy to clear its threshold.

It is not a credential. It is a label this repository's own tooling
generates to group mutation runs — `mutation_check`'s `run_key` argument —
and it grants access to nothing. Nothing needs rotating. Other ADRs' run
keys (gv-582-credential-helper, gv-583-mask-token, gv-591-tween) were
measured against this rule and do not trip it; only this one had the
entropy to.

The working tree no longer contains the tripping adjacency — the sentence
was reworded so that new commits do not re-trip the rule, exactly as the
PEM placeholder above was. This entry exists solely because the
full-history scan still reaches commit 6f9ef5da, which cannot be edited.

Recorded rather than rewritten deliberately: the branch had already been
pushed, and this file's header rules that out ("force-pushing a shared
branch to silence a scanner is a cure worse than the disease"). The
alternative considered and rejected was a force-push dropping the commit —
see ADR 0123's own footnote, which records the correction.
"""
# `commits` for the same reason as the block above: a top-level
# [[allowlists]] needs one of commits/paths/regexes/stopwords before
# `fingerprints` will load, and commit-scoping is the only one of the four
# that cannot widen. NOT `paths` — a path entry would blind every future
# commit of this ADR to real key material, which the header records as
# measured and rejected.
commits = [
  "6f9ef5da0bce57709b1c075b8e9bd0112564e89d",
]
fingerprints = [
  "6f9ef5da0bce57709b1c075b8e9bd0112564e89d:docs/adr/0123-the-safety-lives-in-the-shape-not-a-list.md:generic-api-key:211",
]

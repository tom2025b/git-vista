# gv-tui — the lazygit-style terminal UI (M10). #456 is the skeleton slice.
#
# This slice proves the session boundary from a terminal process: authenticate
# through git-vista-session (the exact bootstrap flow git-vista-mcp and the
# SPA's `gv` link use) and perform one authenticated read. No rendering, no
# writes, no keybindings — those are #457–#462.
#
# Structurally NOT git-vista-server: tests/no_write_dependency.rs proves this
# crate's whole transitive dependency graph never reaches the server crate,
# the same #246 mechanism git-vista-mcp carries.
[package]
name = "gv-tui"
description = "git-vista's terminal UI. This slice: session auth plus one authenticated read."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
git-vista-core = { workspace = true }
# M10.07 (#462), ADR 0105: the conflict view model M4.31 shipped — four-pane
# inspection, the resolution surface, and the marker-file block composer. The
# terminal draws what these decide; it re-decides none of it. Depending on the
# crate rather than copying it is the whole point of the issue.
git-vista-conflicts = { workspace = true }
git-vista-protocol = { workspace = true }
git-vista-session = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The terminal toolkit (M10.02, #457 — phase 2a, the shell). Both pinned
# EXACTLY (`=`), not caret: a terminal toolkit's minor releases change key
# event shapes and backend traits, and this crate's key dispatch and draw
# tests pin behaviour against one known version rather than whatever cargo
# resolves next month.
#
# Pure Rust, no C build scripts, no kernel-ABI crate as a DIRECT dependency —
# so gv-tui stays out of docs/NATIVE_DEPENDENCIES.md's register (scoped to
# crates that speak the kernel ABI directly, and enforced over
# git-vista-server's manifest; see `sandbox::deps`). crossterm reaches the
# terminal through `rustix`/`mio` transitively, exactly as `gix` already does
# for the server, and the register's own rule is that a crate which merely
# depends on such a thing does not belong in it.
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "std", "layout-cache"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }

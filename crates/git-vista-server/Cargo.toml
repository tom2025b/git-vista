[package]
name = "git-vista-server"
description = "Native HTTP backend for git-vista: serves the wasm SPA and a JSON git-history API on one origin, so the browser (iPad Safari) can view real history."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "git-vista-server"
path = "src/main.rs"

[dependencies]
# `stream!` builds the M1.08 progress stream (#61) as the select-loop it actually
# is — watch change, lifetime cap — instead of a hand-rolled `Stream` impl.
# Pure Rust, one small dependency (futures-core), server-side only.
async-stream = "0.3"
axum = "0.8.9"
# base64url (no padding) is the signed history cursor's wire encoding (M1.10,
# #63): URL/query-safe opaque text for the JSON envelope and its truncated tag.
base64 = "0.22"
# CSPRNG for the M1.04 session/bootstrap/CSRF secrets — the OS entropy source
# directly, no `rand` wrapper. Native-server only; never reaches the wasm build.
getrandom = "0.2"
git-vista-core = { workspace = true }
# The versioned HTTP transport contract: protocol negotiation, the API error
# envelope, request-id, and the shared request/response DTOs the router deserialises.
git-vista-protocol = { workspace = true }
git-vista-git = { workspace = true }
# HMAC-SHA256 signs the paged-history offset cursors (M1.10, #63) with a
# per-process random key, so a cursor can't be forged and dies with a restart.
# digest-0.10-compatible, pairing with the existing `sha2` dependency below.
hmac = "0.12"
# Landlock + prctl raw syscalls for the M1.13b (#66) sandbox shim
# (`gv-sandbox`). Reviewed kernel-ABI dependency — see docs/NATIVE_DEPENDENCIES.md.
libc = { workspace = true }
# The durable operation journal (M1.09, #62): SQLite so operation results
# survive a process restart. `bundled` compiles SQLite in rather than linking
# the system library — one less thing this headless server depends on finding.
rusqlite = { version = "0.32", features = ["bundled"] }
# cBPF assembly for the M1.13b (#66) sandbox shim's terminal-action seccomp
# filter. Reviewed kernel-ABI dependency — see docs/NATIVE_DEPENDENCIES.md.
seccompiler = { workspace = true }
# The activity feed's journal is JSONL on disk, and its query params derive
# Deserialize — the same serde the shared models already use.
serde = { workspace = true }
serde_json = { workspace = true }
# SHA-256 for the plan's `operation_hash` (M1.06, #142/#143): the digest that
# binds an approval to one exact operation. Pure-Rust, server-side only.
sha2 = "0.10"
# Named policy-construction/geometry-resolution errors (M1.13b, #66, D2):
# `sandbox::repo_paths::RepoPathsError` and `sandbox::shim::ShimError` derive
# `Display` from this rather than hand-rolling `impl fmt::Display`. Already a
# workspace dependency (root `Cargo.toml`); this crate just hadn't pulled it
# in directly before D2 — see `git-vista-git/Cargo.toml` for the same pattern.
thiserror = { workspace = true }
# `process` lets the /api/branch endpoint shell out to `git branch` without
# blocking the async runtime (Issue #18). `io-util` is what `git_cmd`'s bounded
# reader needs (`AsyncReadExt` on a child's pipes) to stream stdout under a cap
# instead of buffering whatever git prints (M1.10, #63) — declared directly
# rather than inherited from axum/tower-http's own feature choices.
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync", "time"] }
# `tower::Layer` lets us wrap the static file service with a cache-control header
# layer; `set-header` is the tower-http layer that applies it.
tower = "0.5"
# `catch-panic` turns any handler panic into a 500 response instead of a reset
# connection (which iPad Safari would report as an opaque "Load failed").
tower-http = { version = "0.7.0", features = ["fs", "set-header", "catch-panic"] }
# Throwaway repos for the M1.13b (#66) Task 9 boot probe (`sandbox::probe`):
# it builds a scratch repo with a hostile hook on every real server boot, not
# only under test, so this moved here out of [dev-dependencies] — a
# dev-dependency crate is unresolved (E0433) from code the release binary
# actually calls.
tempfile = "3"

[dev-dependencies]
# `ServiceExt::oneshot` drives the router in the contract-layer tests (protocol
# negotiation, the error envelope, the no-path-based-selection guard) without a
# live socket. Test-only: the release binary never pulls tower's `util` feature.
tower = { version = "0.5", features = ["util"] }

# Workspace root for git-vista.
#
# One job per crate:
#   - git-vista-core     : pure logic (graph layout + data models). No platform or UI
#                          deps, so it compiles for wasm and is shared by the frontend.
#   - git-vista-conflicts: the conflict view model (four-pane inspection, the
#                          resolution surface, marker-file blocks). Downstream of
#                          core and protocol, upstream of every client that
#                          resolves a conflict — the browser viewer and gv-tui.
#   - git-vista-protocol : the versioned HTTP transport contract — protocol version
#                          negotiation, the API error envelope, request-id, and the
#                          shared request/response DTOs. Pure/wasm-safe; depended on
#                          by the server and the frontend, independent of core.
#   - git-vista-git      : native-only git reading via gix. Kept apart from core so
#                          gix never reaches the wasm/browser build.
#   - git-vista-server   : the axum HTTP backend — serves the SPA + the /api/* routes.
#   - git-vista-session  : the client half of the session boundary — bootstrap-token
#                          exchange + minimal loopback HTTP/1.1 — shared by every
#                          non-browser client (#456; extracted from git-vista-mcp).
#   - git-vista-mcp      : the MCP stdio bridge — agents drive git-vista through
#                          the same HTTP API (and later the same planner) the browser uses.
#   - git-vista-plan-runner: native YAML manifest encoder and resumable gv-run.
#   - gv-tui             : the lazygit-style terminal UI (M10). Same client posture
#                          as the MCP bridge: session auth, never links the server.
#   - git-vista          : the Leptos frontend GUI, built to wasm by Trunk (the app
#                          you interact with in the browser).
#   - gv-scrollcast      : offline CLI that renders the Print Graph view to video.
#   - git-vista-fixtures : the #448 catalogue of deliberately-broken fixture repos
#                          (dev-dependency only).
[workspace]
resolver = "2"
members = [
    "crates/git-vista-core",
    "crates/git-vista-protocol",
    "crates/git-vista-conflicts",
    "crates/git-vista-git",
    "crates/git-vista-server",
    "crates/git-vista-session",
    "crates/git-vista",
    "crates/git-vista-mcp",
    "crates/git-vista-plan-runner",
    "crates/gv-tui",
    "crates/gv-scrollcast",
    "crates/git-vista-fixtures",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Tom <262510778+tom2025b@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/tom2025b/git-vista"

# Shared dependency versions, referenced from member crates with
# `serde = { workspace = true }` so versions stay in lock-step.
[workspace.dependencies]
git-vista-core = { path = "crates/git-vista-core" }
git-vista-protocol = { path = "crates/git-vista-protocol" }
# M10.07 (#462), ADR 0104: the conflict view model, downstream of core and
# protocol so both the browser viewer and the terminal resolve conflicts
# through one implementation.
git-vista-conflicts = { path = "crates/git-vista-conflicts" }
git-vista-git = { path = "crates/git-vista-git" }
git-vista-plan-runner = { path = "crates/git-vista-plan-runner" }
# The #456 extraction: bootstrap-token session auth + the minimal loopback
# HTTP/1.1 client, shared by git-vista-mcp and gv-tui.
git-vista-session = { path = "crates/git-vista-session" }
# The #448 fixture catalogue — deliberately-broken repositories as named,
# documented shapes. A dev-dependency only: no shipped code builds fixtures.
git-vista-fixtures = { path = "crates/git-vista-fixtures" }
# Landlock/prctl raw syscalls (444/445/446, PR_SET_NO_NEW_PRIVS) for the M1.13b
# (#66) sandbox shim — no stable std wrapper exists. See
# docs/NATIVE_DEPENDENCIES.md (F10) for why this is a reviewed dependency.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# cBPF assembly with masked argument comparisons (C2) for the M1.13b (#66)
# sandbox shim's terminal-action seccomp filter. See docs/NATIVE_DEPENDENCIES.md.
seccompiler = "0.5"
thiserror = "1"
# Opaque, path-independent repository/worktree identity (git-vista-core::identity).
# Only the name-based `v5` constructor is enabled: it is deterministic (SHA-1 over a
# namespace + name) and pulls no randomness, so `core` stays pure and wasm-safe —
# unlike `v4`, which would drag in `getrandom`. `serde` gives string (de)serialization.
uuid = { version = "1", default-features = false, features = ["v5", "serde", "std"] }

# Smaller, faster release binary for the server.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Continuous Integration for git-vista.
#
# Workspace layout this pipeline cares about:
#   - git-vista-core    pure logic crate (model + layout); has tests
#   - git-vista-git     native git reader via gix; has tests (uses the git binary)
#   - git-vista-server  native axum backend: serves the SPA + /api/commits
#   - git-vista         Leptos frontend, built to WASM by Trunk (crates/git-vista)
#
# Four jobs run in parallel, each mapped to a concrete check:
#   1. lint      format + strict native/WASM Clippy + shell syntax
#   2. core      test + check the pure-logic, git-reading, server, and UI crates
#   3. contract  the M1.06 write contract (#146): planner pipeline, argv
#                boundary, staleness gates — its own named check on every PR
#   4. frontend  build the real WASM bundle with Trunk
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref cancels an in-flight run, so PRs don't queue up
# stale builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"   # CI builds are one-shot; incremental only adds overhead.
  RUST_BACKTRACE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Lint: formatting + strict Clippy, the exact commands contributors run
  #    locally (see README "Tests"). Split from the build/test jobs so a
  #    formatting or lint regression is reported as its own red check.
  #
  # Clippy runs twice: once for the native host (the whole workspace) and once
  # for the configured wasm32 target, scoped to the frontend crate. The wasm
  # pass is frontend-only because git-vista-git (gix) and git-vista-server
  # (axum/tokio) are native-only and don't compile for wasm32.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Formatting is clean
        run: cargo fmt --all -- --check

      - name: Clippy (native, strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (wasm32 frontend, strict)
        run: cargo clippy -p git-vista --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Shell launchers parse
        run: |
          bash -n gv dev
          ./gv help >/dev/null

  # ---------------------------------------------------------------------------
  # 1. Core + git + server + frontend crates: build check + tests.
  #
  # git-vista-core is pure logic; git-vista-git reads real repos via gix (its
  # tests shell out to the `git` binary, preinstalled on the runner);
  # git-vista-server is the axum backend; git-vista is the Leptos frontend, whose
  # host-side unit tests (colour/geometry/text/…) run natively because its
  # wasm-only view module is `#[cfg]`-gated out. None need GTK/WebKit, so this job
  # needs nothing beyond stable Rust. Together they carry the project's test suite.
  # ---------------------------------------------------------------------------
  core:
    name: Core (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check core + git + server crates build
        run: cargo check -p git-vista-core -p git-vista-git -p git-vista-server

      - name: Test core + git + server + frontend crates
        run: cargo test -p git-vista-core -p git-vista-git -p git-vista-server -p git-vista

  # ---------------------------------------------------------------------------
  # 3. The M1.06 write contract (#146, parent #59), as its own job so it is a
  #    distinct named check on every PR: the end-to-end pipeline suite
  #    (build → validate → execute for every GitOperation kind + the
  #    single-funnel proof), the #144 argv boundary (tripwire + adversarial
  #    wire fixtures), and the #145 staleness gates.
  #
  #    The same tests also run inside the `core` job's full sweep — running on
  #    every PR is a superset of "PRs touching the planner or a write handler",
  #    chosen over path filters so the check can never be skipped by a filter
  #    gap (and a path-filtered required check would hang pending on
  #    non-matching PRs). This job exists so a contract regression is readable
  #    at a glance in the checks list, and so the contract stays enforced even
  #    if the core job's test invocation is ever narrowed.
  # ---------------------------------------------------------------------------
  contract:
    name: M1.06 write contract (planner + argv boundary + staleness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # libtest exits 0 on "0 passed" — a renamed module would turn the filter
      # into a green no-op. The count floor makes silent de-selection loud.
      - name: Contract suites (with a not-silently-empty floor)
        run: |
          set -o pipefail
          cargo test -p git-vista-server -- contract_suite argv_boundary planner::tests \
            | tee contract-tests.log
          passed=$(grep -oE '[0-9]+ passed' contract-tests.log | awk '{s+=$1} END {print s}')
          echo "contract tests passed: ${passed:-0}"
          if [ "${passed:-0}" -lt 30 ]; then
            echo "::error::Contract filter matched too few tests (${passed:-0} < 30) — did a suite module get renamed?"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 2. Frontend: build the WASM bundle with Trunk.
  #
  # This is the closest CI gets to "the real app builds" — Trunk compiles the
  # Leptos frontend to wasm32 and emits the dist/ bundle the shell loads.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Trunk / WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Install a pinned Trunk release from its prebuilt binary — faster and more
      # reproducible than `cargo install trunk` from source.
      - name: Install Trunk
        env:
          TRUNK_VERSION: v0.21.7
        run: |
          wget -qO- \
            "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf- -C /usr/local/bin trunk
          trunk --version

      # Trunk reads Trunk.toml / index.html from the frontend crate dir and
      # fetches the matching wasm-bindgen automatically.
      - name: Build frontend
        run: cd crates/git-vista && trunk build
